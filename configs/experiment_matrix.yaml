project:
  name: comp547-arpg-tradeoff
  seed: 42
  output_root: results

datasets:
  fashion_mnist:
    image_size: 28
    channels: 1
  cifar10:
    image_size: 16          # grayscale resize in arpg_runner
    channels: 1

baseline:
  model: PixelCNN++
  train_epochs: 20
  batch_size: 16
  learning_rate: 0.0002

arpg:
  model: Transformer
  train_epochs: 20
  batch_size: 16
  learning_rate: 0.0003
  d_model: 192
  n_heads: 6
  n_layers: 6

fashion_mnist_sweep:
  k_values: [1, 2, 4, 7, 14, 28, 56, 112, 196, 392, 784]
  schedules: [random, raster, row]

metrics:
  quality: [fid, bpd]
  efficiency: [latency_ms_per_image, throughput_img_per_s]
  fid_samples: 2048
